name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: |
          python -m pytest test_link_parser.py -v --tb=short

      - name: Check syntax
        run: |
          python -m py_compile bot.py link_parser.py config_runtime.py whoami.py

      - name: Check imports
        run: |
          python -c "import bot; import link_parser; import config_runtime; import whoami; print('All imports OK')"